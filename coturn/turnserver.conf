# coturn config for ReSync Live - minimal, static-username setup (not
# the REST API time-limited-credential mechanism, since the app's
# current code (config.py / sfu/room.py) expects one fixed
# username/password pair, not rotating HMAC-generated ones).
#
# REPLACE the password below before using this for real.

listening-port=3478
tls-listening-port=5349

# Narrow relay port range (not coturn's huge default) so router
# port-forwarding stays a small, fixed set - see docs/COTURN_SETUP.md.
min-port=49152
max-port=49352

fingerprint
lt-cred-mech
user=resync:CHANGE_THIS_PASSWORD
realm=resynclive

no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers

# Loopback/private-range peers aren't legitimate TURN relay targets for
# this use case (relaying guest media, not talking to devices on coturn's
# own local network) - blocking them is a reasonable default hardening
# step, not something specific to this project.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
