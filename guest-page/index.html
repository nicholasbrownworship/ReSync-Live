<!DOCTYPE html>
<!--
  ReSync Live guest join page. No CDN, no third-party JS library - uses
  only the browser's native RTCPeerConnection, WebSocket, and Web Audio
  APIs, talking to our own hand-written signaling server.

  STATUS: core join/renegotiation flow verified against a simulated
  (aiortc) client - see docs/ARCHITECTURE.md. The track-identity mapping
  and per-guest volume sliders below rely on RTCTrackEvent.transceiver.mid,
  which is part of the WebRTC spec, but has ONLY been checked for
  consistency between two aiortc peers in a sandbox - never against a
  real browser. If a guest's slider doesn't show up or shows up
  unlabeled, that's the first thing to suspect.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Session — ReSync Live</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 3rem; }
    input { font-size: 1rem; padding: 0.5rem; margin: 0.3rem; width: 240px; }
    button { font-size: 1.2rem; padding: 0.75rem 2rem; cursor: pointer; margin-top: 0.5rem; }
    #status { margin-top: 1rem; color: #999; }
    label { display: block; margin-top: 0.6rem; color: #aaa; font-size: 0.9rem; }
    #remoteGuests { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin-top: 2rem; }
    .guest-tile { background: #1a1a1a; border-radius: 8px; padding: 0.75rem; width: 220px; }
    .guest-tile video { width: 100%; border-radius: 4px; background: #000; }
    .guest-tile .name { margin-top: 0.4rem; font-weight: bold; }
    .guest-tile input[type="range"] { width: 100%; margin: 0.3rem 0; }
  </style>
</head>
<body>
  <h1>Join the session</h1>

  <label for="serverInput">Host's address (they'll send you this)</label>
  <input id="serverInput" placeholder="e.g. 123.45.67.89:8765" />
  <p style="color:#999; font-size:0.85rem; max-width:320px; margin:0.3rem auto;">
    You'll likely see a "connection isn't private" browser warning first -
    that's expected (the host's app secures the connection itself, without
    a paid certificate). Click "Advanced" then "Proceed" to continue.
  </p>

  <label for="nameInput">Your name</label>
  <input id="nameInput" placeholder="e.g. Josh" />

  <label for="passwordInput">Password (if the host set one)</label>
  <input id="passwordInput" type="password" />

  <label for="cameraSelect">Camera</label>
  <select id="cameraSelect"><option value="">Default camera</option></select>

  <label for="resolutionSelect">Video quality</label>
  <select id="resolutionSelect">
    <option value="480">480p (lower bandwidth)</option>
    <option value="720" selected>720p (recommended)</option>
    <option value="1080">1080p (higher bandwidth)</option>
  </select>

  <label for="micSelect">Microphone</label>
  <select id="micSelect"><option value="">Default microphone</option></select>

  <br />
  <button id="joinBtn">Join</button>
  <div id="status"></div>
  <div id="selfPreviewContainer"></div>
  <div id="remoteGuests"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.location.host) {
        document.getElementById("serverInput").value = window.location.host;
      }
      refreshDeviceList();
    });

    async function refreshDeviceList() {
      // Device LABELS are blank until permission has been granted at
      // least once for this page - devices still show up as
      // selectable, just unlabeled ("Camera 1" etc.) on first load.
      // This is a browser privacy restriction, not a bug here.
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cameraSelect = document.getElementById("cameraSelect");
        const micSelect = document.getElementById("micSelect");
        const priorCamera = cameraSelect.value;
        const priorMic = micSelect.value;
        cameraSelect.innerHTML = '<option value="">Default camera</option>';
        micSelect.innerHTML = '<option value="">Default microphone</option>';

        let camCount = 0, micCount = 0;
        for (const device of devices) {
          const opt = document.createElement("option");
          opt.value = device.deviceId;
          if (device.kind === "videoinput") {
            camCount++;
            opt.textContent = device.label || ("Camera " + camCount);
            cameraSelect.appendChild(opt);
          } else if (device.kind === "audioinput") {
            micCount++;
            opt.textContent = device.label || ("Microphone " + micCount);
            micSelect.appendChild(opt);
          }
        }
        cameraSelect.value = priorCamera;
        micSelect.value = priorMic;
      } catch (err) {
        console.warn("Could not enumerate devices:", err);
      }
    }

    const statusEl = document.getElementById("status");
    const remoteGuestsEl = document.getElementById("remoteGuests");
    const identity = "guest-" + Math.random().toString(36).slice(2, 8);

    function videoConstraintsFor(deviceId) {
      const dims = { "480": [854, 480], "720": [1280, 720], "1080": [1920, 1080] };
      const res = document.getElementById("resolutionSelect").value;
      const [w, h] = dims[res] || dims["720"];
      const constraints = { width: { ideal: w }, height: { ideal: h } };
      if (deviceId) constraints.deviceId = { exact: deviceId };
      return constraints;
    }

    async function applyVideoSenderQuality(sender) {
      // Real, separate WebRTC behavior from capture constraints: browsers
      // automatically downscale OUTGOING video resolution based on their
      // own bandwidth estimation, independent of what getUserMedia
      // captured. This explicitly raises the ceiling and disables that
      // automatic downscaling, since a simple local/LAN connection
      // shouldn't need it, and the browser's default assumptions may be
      // too conservative for one. STATUS: this is a well-documented,
      // standard WebRTC API for exactly this problem, but not verified
      // against a real browser+camera here - only that the call itself
      // is correctly structured per spec.
      if (!sender) return;
      try {
        const params = sender.getParameters();
        if (!params.encodings || params.encodings.length === 0) {
          params.encodings = [{}];
        }
        params.encodings[0].scaleResolutionDownBy = 1;
        const res = document.getElementById("resolutionSelect").value;
        const bitrateMap = { "480": 1_500_000, "720": 2_500_000, "1080": 4_500_000 };
        params.encodings[0].maxBitrate = bitrateMap[res] || 2_500_000;
        await sender.setParameters(params);
      } catch (err) {
        console.warn("Could not apply video sender quality parameters:", err);
      }
    }

    function audioConstraintsFor(deviceId) {
      // Confirmed real cause of "boosted gain still barely audible":
      // Chrome/Firefox/Safari all enable echoCancellation, noiseSuppression,
      // and autoGainControl by DEFAULT on any getUserMedia audio capture -
      // this happens BEFORE the audio ever reaches this app, so digital
      // gain applied afterward can't recover what the browser's own
      // processing already suppressed. Explicitly disabling all three
      // gives the actual raw mic signal instead of fighting the browser's
      // own (possibly aggressive) processing of it.
      const constraints = {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      };
      if (deviceId) constraints.deviceId = { exact: deviceId };
      return constraints;
    }

    // mid -> {identity, display_name, kind}, filled in from "track_info"
    // messages the server sends after every (re)negotiation.
    const trackInfoByMid = {};
    // Tracks that arrived before we knew whose they were yet.
    const pendingTracksByMid = {};
    // identity -> {tile, videoEl, gainNode}
    const guestTiles = {};

    let audioCtx; // created on Join click (a user gesture), required by browsers
    let stream, pc, videoSender, audioSender; // hoisted so device-switch listeners (below) can reach them after joining

    function getOrCreateTile(identity, displayName) {
      if (guestTiles[identity]) return guestTiles[identity];

      const tile = document.createElement("div");
      tile.className = "guest-tile";

      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true; // we play this guest's audio via Web Audio below, not the element itself
      tile.appendChild(video);

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = displayName;
      tile.appendChild(nameEl);

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = "0";
      slider.max = "200";
      slider.value = "100";
      slider.title = "Your local volume for " + displayName + " (only affects what YOU hear)";
      tile.appendChild(slider);

      remoteGuestsEl.appendChild(tile);

      const entry = { tile, videoEl: video, slider, gainNode: null };
      guestTiles[identity] = entry;
      return entry;
    }

    function renderTrack(mid, trackEvent) {
      const info = trackInfoByMid[mid];
      if (!info) {
        pendingTracksByMid[mid] = trackEvent;
        return;
      }
      const tile = getOrCreateTile(info.identity, info.display_name);

      if (info.kind === "video") {
        tile.videoEl.srcObject = trackEvent.streams[0];
      } else {
        // Route this guest's audio through our own GainNode instead of
        // an <audio> element, so the slider only changes what WE hear -
        // no effect on the recording or on any other guest.
        const audioOnlyStream = new MediaStream([trackEvent.track]);
        const source = audioCtx.createMediaStreamSource(audioOnlyStream);
        const gainNode = audioCtx.createGain();
        source.connect(gainNode).connect(audioCtx.destination);
        tile.gainNode = gainNode;
        tile.slider.addEventListener("input", () => {
          gainNode.gain.value = tile.slider.value / 100;
        });
      }
    }

    function handleTrackInfo(msg) {
      for (const [mid, info] of Object.entries(msg.tracks)) {
        trackInfoByMid[mid] = info;
        if (pendingTracksByMid[mid]) {
          renderTrack(mid, pendingTracksByMid[mid]);
          delete pendingTracksByMid[mid];
        }
      }
    }

    // Switch camera/mic WHILE ALREADY CONNECTED, not just before joining -
    // uses RTCRtpSender.replaceTrack(), the standard WebRTC mechanism for
    // this, which does NOT require renegotiation (the server doesn't need
    // to do anything differently; it keeps receiving the same track,
    // just with different underlying content).
    document.getElementById("cameraSelect").addEventListener("change", async () => {
      if (!pc || !videoSender) return; // not connected yet - selection just applies at Join time
      const deviceId = document.getElementById("cameraSelect").value;
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraintsFor(deviceId),
        });
        const newTrack = newStream.getVideoTracks()[0];
        await videoSender.replaceTrack(newTrack);
        stream.getVideoTracks().forEach((t) => t.stop());
        stream.getVideoTracks().forEach((t) => stream.removeTrack(t));
        stream.addTrack(newTrack);
        const selfVideo = document.querySelector("#selfPreviewContainer video");
        if (selfVideo) selfVideo.srcObject = stream;
        await applyVideoSenderQuality(videoSender);
        statusEl.textContent = "Switched camera.";
      } catch (err) {
        statusEl.textContent = "Could not switch camera: " + err.message;
      }
    });

    // Changing quality re-applies with the CURRENTLY selected camera,
    // live, the same way switching cameras does.
    document.getElementById("resolutionSelect").addEventListener("change", async () => {
      if (!pc || !videoSender) return;
      const deviceId = document.getElementById("cameraSelect").value;
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraintsFor(deviceId),
        });
        const newTrack = newStream.getVideoTracks()[0];
        await videoSender.replaceTrack(newTrack);
        stream.getVideoTracks().forEach((t) => t.stop());
        stream.getVideoTracks().forEach((t) => stream.removeTrack(t));
        stream.addTrack(newTrack);
        const selfVideo = document.querySelector("#selfPreviewContainer video");
        if (selfVideo) selfVideo.srcObject = stream;
        await applyVideoSenderQuality(videoSender);
        statusEl.textContent = "Switched video quality.";
      } catch (err) {
        statusEl.textContent = "Could not switch video quality: " + err.message;
      }
    });

    document.getElementById("micSelect").addEventListener("change", async () => {
      if (!pc || !audioSender) return;
      const deviceId = document.getElementById("micSelect").value;
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          audio: audioConstraintsFor(deviceId),
        });
        const newTrack = newStream.getAudioTracks()[0];
        await audioSender.replaceTrack(newTrack);
        stream.getAudioTracks().forEach((t) => t.stop());
        stream.getAudioTracks().forEach((t) => stream.removeTrack(t));
        stream.addTrack(newTrack);
        statusEl.textContent = "Switched microphone.";
      } catch (err) {
        statusEl.textContent = "Could not switch microphone: " + err.message;
      }
    });

    document.getElementById("joinBtn").addEventListener("click", async () => {
      const address = document.getElementById("serverInput").value.trim();
      const displayName = document.getElementById("nameInput").value.trim() || identity;
      const password = document.getElementById("passwordInput").value;

      if (!address) {
        statusEl.textContent = "Enter the host's address first.";
        return;
      }

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      statusEl.textContent = "Requesting camera/mic...";
      let actualResText = "";
      try {
        const chosenCamera = document.getElementById("cameraSelect").value;
        const chosenMic = document.getElementById("micSelect").value;
        stream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraintsFor(chosenCamera),
          audio: audioConstraintsFor(chosenMic),
        });
        refreshDeviceList(); // labels are only populated AFTER permission is granted

        // Report what the camera ACTUALLY delivered, not just what was
        // requested - "ideal" constraints are hints, not guarantees, and
        // this is the only way to know if a resolution complaint is a
        // capture-hardware limit or something else.
        const videoTrack = stream.getVideoTracks()[0];
        if (videoTrack) {
          const settings = videoTrack.getSettings();
          actualResText = ` (camera delivering ${settings.width}x${settings.height})`;
          console.log(`Actual camera resolution: ${settings.width}x${settings.height} @ ${settings.frameRate}fps`);
        }
      } catch (err) {
        statusEl.textContent = "Could not access camera/mic: " + err.message;
        return;
      }

      // Show what's actually being captured, immediately - the biggest
      // real gap found in testing was granting camera permission and
      // then seeing NOTHING happen, with no way to tell it was actually
      // working. This is your own feed, muted (so you don't hear
      // yourself echo back), separate from anyone else's session audio.
      const selfTile = document.createElement("div");
      selfTile.className = "guest-tile";
      const selfVideo = document.createElement("video");
      selfVideo.autoplay = true;
      selfVideo.muted = true;
      selfVideo.srcObject = stream;
      selfTile.appendChild(selfVideo);
      const selfLabel = document.createElement("div");
      selfLabel.className = "name";
      selfLabel.textContent = "You (" + (displayName || "unnamed") + ")";
      selfTile.appendChild(selfLabel);
      document.getElementById("selfPreviewContainer").appendChild(selfTile);

      if (stream.getVideoTracks().length === 0) {
        statusEl.textContent = "Warning: no video track (camera may be unavailable) - continuing with audio only.";
      }
      if (stream.getAudioTracks().length === 0) {
        statusEl.textContent = "Warning: no audio track (microphone may be unavailable).";
      }

      const ws = new WebSocket("wss://" + address);

      ws.onopen = () => { statusEl.textContent = "Waiting for session details..."; };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "config") {
          pc = new RTCPeerConnection({ iceServers: msg.ice_servers || [] });
          stream.getTracks().forEach((track) => {
            const sender = pc.addTrack(track, stream);
            if (track.kind === "video") videoSender = sender;
            else if (track.kind === "audio") audioSender = sender;
          });
          applyVideoSenderQuality(videoSender);

          pc.ontrack = (trackEvent) => {
            const mid = trackEvent.transceiver ? trackEvent.transceiver.mid : null;
            if (mid === null) {
              console.warn("No transceiver.mid on incoming track - cannot identify whose it is.");
              return;
            }
            renderTrack(mid, trackEvent);
          };

          // Send every locally-discovered network path to the server AS
          // IT'S FOUND, not just what's in the initial offer - browsers
          // discover candidates asynchronously by default (trickle ICE),
          // and without relaying these, the server would never learn
          // about anything found after the first offer was sent. This
          // was a confirmed real bug: without it, media could fail to
          // connect even though signaling completed successfully.
          pc.onicecandidate = (event) => {
            ws.send(JSON.stringify({
              type: "ice_candidate",
              candidate: event.candidate ? event.candidate.toJSON() : null,
            }));
          };

          // The REAL signal of whether media is actually flowing is
          // connectionState, not "we finished exchanging an offer/
          // answer" - those are different things in WebRTC, and
          // conflating them was a real bug: it could show "Connected"
          // even if the underlying media connection then failed.
          pc.onconnectionstatechange = () => {
            console.log("connectionState:", pc.connectionState);
            if (pc.connectionState === "connected") {
              statusEl.textContent = "Connected as " + displayName + actualResText;
              applyVideoSenderQuality(videoSender); // reapply once fully connected, as a safety net
            } else if (pc.connectionState === "connecting") {
              statusEl.textContent = "Establishing media connection...";
            } else if (pc.connectionState === "failed") {
              statusEl.textContent = "Media connection FAILED - signaling worked but the actual audio/video link did not.";
            } else if (pc.connectionState === "disconnected") {
              statusEl.textContent = "Media connection disconnected.";
            }
          };

          statusEl.textContent = "Connecting...";
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({
            type: "offer", identity: identity, display_name: displayName,
            password: password, sdp: pc.localDescription.sdp,
          }));

        } else if (msg.type === "answer") {
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          statusEl.textContent = "Signaling done, waiting for media connection...";

        } else if (msg.type === "offer") {
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription.sdp }));

        } else if (msg.type === "ice_candidate") {
          if (msg.candidate) {
            try {
              await pc.addIceCandidate(msg.candidate);
            } catch (err) {
              console.warn("Failed to add remote ICE candidate:", err);
            }
          }

        } else if (msg.type === "track_info") {
          handleTrackInfo(msg);

        } else if (msg.type === "error") {
          statusEl.textContent = "Error: " + msg.message;
        }
      };

      ws.onerror = () => { statusEl.textContent = "Signaling connection failed."; };
      ws.onclose = () => { statusEl.textContent = "Disconnected."; };
    });
  </script>
</body>
</html>
