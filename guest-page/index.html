<!DOCTYPE html>
<!--
  ReSync Live guest join page. No CDN, no third-party JS library - uses
  only the browser's native RTCPeerConnection and WebSocket APIs, talking
  to our own hand-written signaling server (signaling/ws_server.py).

  STATUS: first draft, not yet tested end-to-end.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Session — ReSync Live</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 4rem; }
    button { font-size: 1.2rem; padding: 0.75rem 2rem; cursor: pointer; }
    #status { margin-top: 1rem; color: #999; }
  </style>
</head>
<body>
  <h1>Join the session</h1>
  <button id="joinBtn">Join</button>
  <div id="status"></div>

  <script>
    // TODO: make configurable rather than hardcoded once host/port is settled.
    const SIGNALING_URL = "ws://localhost:8765";

    const statusEl = document.getElementById("status");
    const identity = "guest-" + Math.random().toString(36).slice(2, 8);

    document.getElementById("joinBtn").addEventListener("click", async () => {
      statusEl.textContent = "Requesting camera/mic...";

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      } catch (err) {
        statusEl.textContent = "Could not access camera/mic: " + err.message;
        return;
      }

      const pc = new RTCPeerConnection();
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      const ws = new WebSocket(SIGNALING_URL);

      ws.onopen = async () => {
        statusEl.textContent = "Connecting...";
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({
          type: "offer",
          identity: identity,
          sdp: pc.localDescription.sdp,
        }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "answer") {
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          statusEl.textContent = "Connected as " + identity;
        }
        // NOTE: server-initiated renegotiation offers (when another
        // guest joins later) aren't handled here yet - see the
        // renegotiation TODO in sfu/room.py. Needed before this
        // actually supports more than 2 guests.
      };

      ws.onerror = () => {
        statusEl.textContent = "Signaling connection failed.";
      };

      ws.onclose = () => {
        statusEl.textContent = "Disconnected.";
      };
    });
  </script>
</body>
</html>
