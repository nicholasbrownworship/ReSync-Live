<!DOCTYPE html>
<!--
  ReSync Live guest join page. No CDN, no third-party JS library - uses
  only the browser's native RTCPeerConnection, WebSocket, and Web Audio
  APIs, talking to our own hand-written signaling server.

  STATUS: core join/renegotiation flow verified against a simulated
  (aiortc) client - see docs/ARCHITECTURE.md. The track-identity mapping
  and per-guest volume sliders below rely on RTCTrackEvent.transceiver.mid,
  which is part of the WebRTC spec, but has ONLY been checked for
  consistency between two aiortc peers in a sandbox - never against a
  real browser. If a guest's slider doesn't show up or shows up
  unlabeled, that's the first thing to suspect.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Session — ReSync Live</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 3rem; }
    input { font-size: 1rem; padding: 0.5rem; margin: 0.3rem; width: 240px; }
    button { font-size: 1.2rem; padding: 0.75rem 2rem; cursor: pointer; margin-top: 0.5rem; }
    #status { margin-top: 1rem; color: #999; }
    label { display: block; margin-top: 0.6rem; color: #aaa; font-size: 0.9rem; }
    #remoteGuests { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.2rem; margin-top: 2rem; }
    .guest-tile { background: #1a1a1a; border-radius: 8px; padding: 0.75rem; width: 220px; }
    .guest-tile video { width: 100%; border-radius: 4px; background: #000; }
    .guest-tile .name { margin-top: 0.4rem; font-weight: bold; }
    .guest-tile input[type="range"] { width: 100%; margin: 0.3rem 0; }
  </style>
</head>
<body>
  <h1>Join the session</h1>

  <label for="serverInput">Host's address (they'll send you this)</label>
  <input id="serverInput" placeholder="e.g. 123.45.67.89:8765" />
  <p style="color:#999; font-size:0.85rem; max-width:320px; margin:0.3rem auto;">
    You'll likely see a "connection isn't private" browser warning first -
    that's expected (the host's app secures the connection itself, without
    a paid certificate). Click "Advanced" then "Proceed" to continue.
  </p>

  <label for="nameInput">Your name</label>
  <input id="nameInput" placeholder="e.g. Josh" />

  <label for="passwordInput">Password (if the host set one)</label>
  <input id="passwordInput" type="password" />

  <br />
  <button id="joinBtn">Join</button>
  <div id="status"></div>
  <div id="selfPreviewContainer"></div>
  <div id="remoteGuests"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.location.host) {
        document.getElementById("serverInput").value = window.location.host;
      }
    });

    const statusEl = document.getElementById("status");
    const remoteGuestsEl = document.getElementById("remoteGuests");
    const identity = "guest-" + Math.random().toString(36).slice(2, 8);

    // mid -> {identity, display_name, kind}, filled in from "track_info"
    // messages the server sends after every (re)negotiation.
    const trackInfoByMid = {};
    // Tracks that arrived before we knew whose they were yet.
    const pendingTracksByMid = {};
    // identity -> {tile, videoEl, gainNode}
    const guestTiles = {};

    let audioCtx; // created on Join click (a user gesture), required by browsers

    function getOrCreateTile(identity, displayName) {
      if (guestTiles[identity]) return guestTiles[identity];

      const tile = document.createElement("div");
      tile.className = "guest-tile";

      const video = document.createElement("video");
      video.autoplay = true;
      video.muted = true; // we play this guest's audio via Web Audio below, not the element itself
      tile.appendChild(video);

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = displayName;
      tile.appendChild(nameEl);

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = "0";
      slider.max = "200";
      slider.value = "100";
      slider.title = "Your local volume for " + displayName + " (only affects what YOU hear)";
      tile.appendChild(slider);

      remoteGuestsEl.appendChild(tile);

      const entry = { tile, videoEl: video, slider, gainNode: null };
      guestTiles[identity] = entry;
      return entry;
    }

    function renderTrack(mid, trackEvent) {
      const info = trackInfoByMid[mid];
      if (!info) {
        pendingTracksByMid[mid] = trackEvent;
        return;
      }
      const tile = getOrCreateTile(info.identity, info.display_name);

      if (info.kind === "video") {
        tile.videoEl.srcObject = trackEvent.streams[0];
      } else {
        // Route this guest's audio through our own GainNode instead of
        // an <audio> element, so the slider only changes what WE hear -
        // no effect on the recording or on any other guest.
        const audioOnlyStream = new MediaStream([trackEvent.track]);
        const source = audioCtx.createMediaStreamSource(audioOnlyStream);
        const gainNode = audioCtx.createGain();
        source.connect(gainNode).connect(audioCtx.destination);
        tile.gainNode = gainNode;
        tile.slider.addEventListener("input", () => {
          gainNode.gain.value = tile.slider.value / 100;
        });
      }
    }

    function handleTrackInfo(msg) {
      for (const [mid, info] of Object.entries(msg.tracks)) {
        trackInfoByMid[mid] = info;
        if (pendingTracksByMid[mid]) {
          renderTrack(mid, pendingTracksByMid[mid]);
          delete pendingTracksByMid[mid];
        }
      }
    }

    document.getElementById("joinBtn").addEventListener("click", async () => {
      const address = document.getElementById("serverInput").value.trim();
      const displayName = document.getElementById("nameInput").value.trim() || identity;
      const password = document.getElementById("passwordInput").value;

      if (!address) {
        statusEl.textContent = "Enter the host's address first.";
        return;
      }

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      statusEl.textContent = "Requesting camera/mic...";
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      } catch (err) {
        statusEl.textContent = "Could not access camera/mic: " + err.message;
        return;
      }

      // Show what's actually being captured, immediately - the biggest
      // real gap found in testing was granting camera permission and
      // then seeing NOTHING happen, with no way to tell it was actually
      // working. This is your own feed, muted (so you don't hear
      // yourself echo back), separate from anyone else's session audio.
      const selfTile = document.createElement("div");
      selfTile.className = "guest-tile";
      const selfVideo = document.createElement("video");
      selfVideo.autoplay = true;
      selfVideo.muted = true;
      selfVideo.srcObject = stream;
      selfTile.appendChild(selfVideo);
      const selfLabel = document.createElement("div");
      selfLabel.className = "name";
      selfLabel.textContent = "You (" + (displayName || "unnamed") + ")";
      selfTile.appendChild(selfLabel);
      document.getElementById("selfPreviewContainer").appendChild(selfTile);

      if (stream.getVideoTracks().length === 0) {
        statusEl.textContent = "Warning: no video track (camera may be unavailable) - continuing with audio only.";
      }
      if (stream.getAudioTracks().length === 0) {
        statusEl.textContent = "Warning: no audio track (microphone may be unavailable).";
      }

      let pc;
      const ws = new WebSocket("wss://" + address);

      ws.onopen = () => { statusEl.textContent = "Waiting for session details..."; };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "config") {
          pc = new RTCPeerConnection({ iceServers: msg.ice_servers || [] });
          stream.getTracks().forEach((track) => pc.addTrack(track, stream));

          pc.ontrack = (trackEvent) => {
            const mid = trackEvent.transceiver ? trackEvent.transceiver.mid : null;
            if (mid === null) {
              console.warn("No transceiver.mid on incoming track - cannot identify whose it is.");
              return;
            }
            renderTrack(mid, trackEvent);
          };

          // The REAL signal of whether media is actually flowing is
          // connectionState, not "we finished exchanging an offer/
          // answer" - those are different things in WebRTC, and
          // conflating them was a real bug: it could show "Connected"
          // even if the underlying media connection then failed.
          pc.onconnectionstatechange = () => {
            console.log("connectionState:", pc.connectionState);
            if (pc.connectionState === "connected") {
              statusEl.textContent = "Connected as " + displayName;
            } else if (pc.connectionState === "connecting") {
              statusEl.textContent = "Establishing media connection...";
            } else if (pc.connectionState === "failed") {
              statusEl.textContent = "Media connection FAILED - signaling worked but the actual audio/video link did not.";
            } else if (pc.connectionState === "disconnected") {
              statusEl.textContent = "Media connection disconnected.";
            }
          };

          statusEl.textContent = "Connecting...";
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({
            type: "offer", identity: identity, display_name: displayName,
            password: password, sdp: pc.localDescription.sdp,
          }));

        } else if (msg.type === "answer") {
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          statusEl.textContent = "Signaling done, waiting for media connection...";

        } else if (msg.type === "offer") {
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: "answer", sdp: pc.localDescription.sdp }));

        } else if (msg.type === "track_info") {
          handleTrackInfo(msg);

        } else if (msg.type === "error") {
          statusEl.textContent = "Error: " + msg.message;
        }
      };

      ws.onerror = () => { statusEl.textContent = "Signaling connection failed."; };
      ws.onclose = () => { statusEl.textContent = "Disconnected."; };
    });
  </script>
</body>
</html>
