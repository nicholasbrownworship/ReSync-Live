<!DOCTYPE html>
<!--
  ReSync Live guest join page. No CDN, no third-party JS library - uses
  only the browser's native RTCPeerConnection and WebSocket APIs, talking
  to our own hand-written signaling server (signaling/ws_server.py).

  STATUS: first draft, not yet tested end-to-end.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Session — ReSync Live</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 4rem; }
    button { font-size: 1.2rem; padding: 0.75rem 2rem; cursor: pointer; }
    #status { margin-top: 1rem; color: #999; }
  </style>
</head>
<body>
  <h1>Join the session</h1>
  <button id="joinBtn">Join</button>
  <div id="status"></div>
  <div id="remoteVideos" style="display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; margin-top:2rem;"></div>

  <script>
    // TODO: make configurable rather than hardcoded once host/port is settled.
    const SIGNALING_URL = "ws://localhost:8765";

    const statusEl = document.getElementById("status");
    const identity = "guest-" + Math.random().toString(36).slice(2, 8);

    document.getElementById("joinBtn").addEventListener("click", async () => {
      statusEl.textContent = "Requesting camera/mic...";

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      } catch (err) {
        statusEl.textContent = "Could not access camera/mic: " + err.message;
        return;
      }

      const pc = new RTCPeerConnection();
      stream.getTracks().forEach((track) => pc.addTrack(track, stream));

      // Display each remote guest's track as it arrives. NOTE: this
      // groups purely by arrival order, not by which guest a track
      // belongs to - the signaling protocol doesn't yet attach an
      // identity to each track, so with more than 2 guests this will
      // need that mapping added before it's actually usable.
      pc.ontrack = (event) => {
        const el = document.createElement(event.track.kind === "video" ? "video" : "audio");
        el.autoplay = true;
        el.style.width = "240px";
        el.srcObject = event.streams[0];
        document.getElementById("remoteVideos").appendChild(el);
      };

      const ws = new WebSocket(SIGNALING_URL);

      ws.onopen = async () => {
        statusEl.textContent = "Connecting...";
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({
          type: "offer",
          identity: identity,
          sdp: pc.localDescription.sdp,
        }));
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "answer") {
          // Response to OUR initial join offer.
          await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
          statusEl.textContent = "Connected as " + identity;

        } else if (msg.type === "offer") {
          // The SERVER is renegotiating (another guest started
          // publishing audio/video and needs to reach us). Respond
          // with a fresh answer - do not send a new offer of our own.
          await pc.setRemoteDescription({ type: "offer", sdp: msg.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({
            type: "answer",
            sdp: pc.localDescription.sdp,
          }));
        }
      };

      ws.onerror = () => {
        statusEl.textContent = "Signaling connection failed.";
      };

      ws.onclose = () => {
        statusEl.textContent = "Disconnected.";
      };
    });
  </script>
</body>
</html>
